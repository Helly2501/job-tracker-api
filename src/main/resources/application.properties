spring.application.name=job-tracker-api

# Private values (password) come from secrets.properties, which is NOT committed to GitHub
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/job_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true